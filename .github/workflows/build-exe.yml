name: Build PS Base Windows EXE

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout PS Base
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Resolve release metadata
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          elseif ("${{ github.event.head_commit.message }}".Contains('[refresh-release]')) {
            $version = "0.1.0"
          }
          else {
            $version = "0.0.0-dev.${{ github.run_number }}"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid PS Base release version: $version"
          }

          $toolchain = Get-Content ./build/toolchain.json -Raw | ConvertFrom-Json
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "POWERSHELL_VERSION=$($toolchain.powershell)" >> $env:GITHUB_ENV

      - name: Package installer application
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'build/payload'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          Copy-Item ./PS-Base.ps1 $payload
          Copy-Item ./PS-Base-GUI.ps1 $payload
          Copy-Item ./README.md $payload
          Copy-Item ./docs (Join-Path $payload 'docs') -Recurse
          Copy-Item ./catalog (Join-Path $payload 'catalog') -Recurse
          Copy-Item ./src/PSBase (Join-Path $payload 'src/PSBase') -Recurse

          $appAsset = "psbase-app-v$env:APP_VERSION.zip"
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath (Join-Path $PWD "build/$appAsset") -CompressionLevel Optimal
          $appHash = (Get-FileHash (Join-Path $PWD "build/$appAsset") -Algorithm SHA256).Hash.ToLowerInvariant()

          $manifest = [ordered]@{
            version = $env:APP_VERSION
            powershellVersion = $env:POWERSHELL_VERSION
            appAsset = $appAsset
            appSha256 = $appHash
          }
          $manifest | ConvertTo-Json | Set-Content ./build/psbase-bootstrap.json -Encoding utf8

      - name: Build lightweight bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./build -Force | Out-Null
          gofmt -w ./cmd/psbase-bootstrap/main.go
          go test ./...
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags="-s -w" -o ./build/PS-Base.exe ./cmd/psbase-bootstrap

          if (-not (Test-Path ./build/PS-Base.exe)) {
            throw 'The PS Base bootstrapper was not produced.'
          }

      - name: Smoke test bootstrapper
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./build/PS-Base.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "PS Base bootstrapper smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./build/PS-Base.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PS-Base.exe" | Set-Content ./build/PS-Base.exe.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS-Base-Windows-x64
          path: |
            build/PS-Base.exe
            build/PS-Base.exe.sha256

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[refresh-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: PS Base v0.1.0
          generate_release_notes: false
          prerelease: false
          overwrite_files: true
          files: |
            build/PS-Base.exe
            build/PS-Base.exe.sha256
            build/psbase-bootstrap.json
            build/psbase-app-v${{ env.APP_VERSION }}.zip
